[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "pandoc-wheel"
authors = [
    {name = "the pandoc-wheel authors", email = "3105306+timkpaine@users.noreply.github.com"},
]
description = "Pandoc binaries distributed as Python wheels"
readme = "README.md"
license = { text = "Apache-2.0 AND GPL-2.0-or-later AND MIT" }
version = "0.1.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "cibuildwheel",
    "codespell",
    "hatchling",
    "mdformat",
    "mdformat-myst",
    "mdformat-tables>=1",
    "pypandoc",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.urls]
Repository = "https://github.com/nbprint/pandoc-wheel"
Homepage = "https://github.com/nbprint/pandoc-wheel"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "pandoc_wheel/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "pandoc_wheel/tests/integration/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = []

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
only-include = [
    "pandoc_wheel",
    "hatch_build.py",
    "js/package.json",
    "js/package-lock.json",
]
exclude = [
    "/pandoc_wheel/bin",
]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = [
    "pandoc_wheel",
]
artifacts = [
    "pandoc_wheel/bin/",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.cibuildwheel]
build = "cp311-*"
test-command = "python -m pytest --import-mode=importlib {project}/pandoc_wheel/tests"
test-requires = ["pytest", "pypandoc"]

[tool.cibuildwheel.linux]
repair-wheel-command = ""
skip = "*i686 *musllinux*"
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
repair-wheel-command = ""
environment = {MACOSX_DEPLOYMENT_TARGET="15.0"}
archs = "arm64"

[tool.cibuildwheel.windows]
repair-wheel-command = ""
archs = "AMD64"

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "pandoc_wheel/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "pandoc_wheel",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]
